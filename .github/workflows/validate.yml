name: Validate AGL Reference

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python validate_agl.py abstract_valid_spec.json
      - run: python -m unittest -v test_validator.py
      - run: python lab2_explained.py